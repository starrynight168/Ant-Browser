name: Publish Windows Packages

on:
  workflow_call:
    inputs:
      version:
        description: 版本号，例如 1.9.1；留空则读取 frontend_flutter/pubspec.yaml
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 1.9.1；留空则读取 frontend_flutter/pubspec.yaml
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows amd64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Verify runtime files
        shell: bash
        run: bash tools/runtime/verify-runtime.sh windows-amd64

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" && "$GITHUB_REF_NAME" =~ ^[vV]?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$version" ]]; then
            version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' frontend_flutter/pubspec.yaml | head -n 1)"
          fi
          if [[ -z "$version" ]]; then
            echo "::error::无法从 ref '$GITHUB_REF_NAME' 解析版本号，请在 workflow_dispatch 中显式传 version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "package version: $version"

      - name: Build native Flutter app
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          & ".\bat\build-native.ps1" -Mode release -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Native Flutter build failed with exit code $LASTEXITCODE" }

      - name: Assemble staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE "publish\staging\windows"
          $native = Join-Path $env:GITHUB_WORKSPACE "build\native\release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path (Join-Path $native "*") -Destination $stage -Recurse -Force
          Copy-Item "publish\config.init.yaml" (Join-Path $stage "config.yaml") -Force
          New-Item -ItemType Directory -Path (Join-Path $stage "chrome") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "data\diagnostics") -Force | Out-Null
          Copy-Item "chrome\README.md" (Join-Path $stage "chrome\README.md") -Force
          Copy-Item "tools\ant-chrome-diagnostics-watcher.ps1" (Join-Path $stage "data\diagnostics") -Force
          Copy-Item "tools\install-ant-chrome-diagnostics-watcher.ps1" (Join-Path $stage "data\diagnostics") -Force
          $required = @(
            "ant-chrome.exe",
            "ui\ant-browser-ui.exe",
            "ui\flutter_windows.dll",
            "ui\data\flutter_assets",
            "bin\xray.exe",
            "bin\sing-box.exe"
          )
          foreach ($item in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $item))) {
              throw "Native package is missing: $item"
            }
          }
          Get-ChildItem $stage -Force | Format-Table Name,Length

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path (Join-Path $nsis "makensis.exe"))) {
            choco install nsis --no-progress -y
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $staging = Join-Path $env:GITHUB_WORKSPACE "publish\staging\windows"
          New-Item -ItemType Directory -Path "publish\output" -Force | Out-Null
          & makensis "/DVERSION=$env:VERSION" "/DSTAGINGDIR=$staging" "publish\installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          Get-ChildItem "publish\output\AntBrowser-Setup-*.exe" | Format-Table Name,Length

      - name: Build portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $portableName = "AntBrowser-$env:VERSION-windows-amd64-portable"
          $root = Join-Path $env:GITHUB_WORKSPACE "publish\staging\$portableName"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item "publish\staging\windows\*" $root -Recurse -Force
          $zip = "publish\output\$portableName.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $root -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-Table Name,Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ant-browser-windows-amd64
          path: |
            publish/output/AntBrowser-Setup-*.exe
            publish/output/AntBrowser-*-windows-amd64-portable.zip
          if-no-files-found: error
